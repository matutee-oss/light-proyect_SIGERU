<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiGeRU — Iniciar sesión</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-auth">

  <nav class="barra-navegacion">
    <span class="logo">SiGeRU <span>MONTEVIDEO</span></span>
    <div class="enlaces">
      <a href="index.html">Inicio</a>
      <a href="registro.html">Registrarse</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-card-eyebrow">Acceso al sistema</div>
        <h1 class="auth-card-titulo">Iniciar sesión</h1>
      </div>

      <form id="form-login" class="auth-form">
        <div class="auth-campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="auth-campo">
          <div class="auth-label-row">
            <label for="password">Contraseña</label>
            <a href="#" class="auth-link-small">¿Olvidaste tu contraseña?</a>
          </div>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="auth-btn">Ingresar al sistema</button>
      </form>

      <div id="mensaje-login" class="auth-mensaje"></div>

      <p class="auth-footer-link">
        ¿No tenés cuenta? <a href="registro.html">Registrate</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
