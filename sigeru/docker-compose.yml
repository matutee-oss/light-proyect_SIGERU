# SiGeRU — entorno completo con Docker
#   docker compose up -d --build
#   Frontend:   http://localhost:3000
#   API:        http://localhost:8080
#   phpMyAdmin: http://localhost:8081
#   Tests:      docker compose exec backend composer test

services:
  # Base de datos MySQL (se carga sola con sigeru.sql la primera vez)
  db:
    image: mysql:8.0
    container_name: sigeru_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-light}
      MYSQL_DATABASE: sigeru
      TZ: America/Montevideo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=-03:00
    ports:
      - "3307:3306"   # 3307 para no chocar con un MySQL/XAMPP local
    volumes:
      - sigeru_db_data:/var/lib/mysql
      - ./sigeru.sql:/docker-entrypoint-initdb.d/01-sigeru.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-light}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sigeru_net

  # API PHP 8.2 + Apache
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sigeru_backend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy   # espera a que MySQL esté listo
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: sigeru
      DB_USER: root
      DB_PASS: ${DB_ROOT_PASSWORD:-light}
      # Base que usan los tests de integración (se crea sola, nunca toca "sigeru")
      DB_TEST_HOST: db
      DB_TEST_NAME: sigeru_test
      DB_TEST_USER: root
      DB_TEST_PASS: ${DB_ROOT_PASSWORD:-light}
      TZ: America/Montevideo
    volumes:
      - ./backend:/var/www/html
      - ./sigeru.sql:/var/www/sigeru.sql:ro   # los tests de integración lo leen
      - backend_vendor:/var/www/html/vendor
    networks:
      - sigeru_net

  # Frontend estático con Nginx
  frontend:
    image: nginx:alpine
    container_name: sigeru_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - sigeru_net

  # phpMyAdmin (opcional, para ver la base)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sigeru_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-light}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sigeru_net

volumes:
  sigeru_db_data:
  backend_vendor:

networks:
  sigeru_net:
    driver: bridge
