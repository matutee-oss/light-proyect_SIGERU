<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        # Pasa el token "Authorization: Bearer ..." a PHP
        CGIPassAuth On
    </Directory>

    # La carpeta de tests y vendor no se publican
    <DirectoryMatch "^/var/www/html/(tests|vendor)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
