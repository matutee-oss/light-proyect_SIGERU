server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache corto para que los cambios de JS/CSS se vean al recargar
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
