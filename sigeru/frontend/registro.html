<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiGeRU — Registro</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <nav class="barra-navegacion">
    <span class="logo">SiGeRU <span>MONTEVIDEO</span></span>
    <div class="enlaces">
      <a href="index.html">Inicio</a>
      <a href="login.html">Iniciar sesión</a>
    </div>
  </nav>

  <main>
    <div class="contenido-con-lateral" style="max-width: 900px; margin: 56px auto;">
      <section class="tarjeta" style="margin: 0;">
      <div class="eyebrow">Alta de usuario</div>
      <h2>Crear cuenta</h2>

      <form id="form-registro" class="formulario">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="campo">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" required>
        </div>

        <div class="campo">
          <label for="ci">Cédula de identidad</label>
          <input type="text" id="ci" name="ci" required inputmode="numeric" placeholder="1.234.567-2">
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono">
        </div>

        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required minlength="8">
        </div>

        <div class="campo">
          <label for="tipo_usuario">Tipo de usuario</label>
          <select id="tipo_usuario" name="tipo_usuario">
            <option value="vecino">Vecino</option>
            <option value="operario">Operario</option>
            <option value="cuadrilla">Cuadrilla</option>
            <option value="administrador">Administrador</option>
          </select>
        </div>

        <div id="campo-zona" class="campo">
          <label for="id_zona">Zona donde vivís</label>
          <select id="id_zona" name="id_zona"><option value="">Elegir después</option></select>
        </div>

        <div id="campo-codigo" class="campo" style="display:none;">
          <label for="codigo_funcionario">Código de funcionario</label>
          <input type="text" id="codigo_funcionario" name="codigo_funcionario" placeholder="Provisto por la Intendencia">
        </div>

        <div id="campo-centro" class="campo" style="display:none;">
          <label for="id_centro">Centro de acopio donde trabaja (ID)</label>
          <input type="number" id="id_centro" name="id_centro">
        </div>

        <button type="submit">Registrarme</button>
      </form>

      <div id="mensaje-registro"></div>
    </section>

      <aside class="lateral-imagen" aria-hidden="true">
        <img src="img/lateral-registro.jpg" alt="" onerror="this.onerror=null;this.src='img/placeholder.svg'">
      </aside>
    </div>
  </main>

  <footer class="pie-pagina">
    <p>&copy; 2026 Light. Todos los derechos reservados.</p>
    <p class="mono">SiGeRU · Sistema de Gestión de Residuos Urbanos</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
